services:
  bros-ecommerce.web:
    image: ${DOCKER_REGISTRY-}brosecommerceweb
    build:
      context: .
      dockerfile: BROS-ECommerce.Web/Dockerfile
    depends_on:
      - sqlserver
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-bros
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Bros123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Bros123! -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlserver_data: